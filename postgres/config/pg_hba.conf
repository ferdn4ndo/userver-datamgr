# PostgreSQL client authentication (see postgresql.conf: hba_file).
# TYPE  DATABASE  USER  ADDRESS  METHOD

# Local Unix socket
local   all       all                  trust

# TCP loopback (healthchecks, local tools)
host    all       all  127.0.0.1/32   trust
host    all       all  ::1/128        trust

# Remote: password auth over TLS or plain TCP (use sslmode=require from clients to encrypt)
hostssl all       all  all            scram-sha-256
host    all       all  all            scram-sha-256
