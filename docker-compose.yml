services:
  userver-postgres:
    container_name: userver-postgres
    image: postgres:18-alpine
    command: postgres -c config_file=/etc/postgresql/config/postgresql.conf
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/config:/etc/postgresql/config
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Must match POSTGRES_USER in postgres/.env (defaults to postgres if unset).
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  userver-redis:
    image: redis:8.6-alpine
    container_name: userver-redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  userver-adminer:
    image: adminer:5-standalone
    container_name: userver-adminer
    env_file:
      - ./adminer/.env
    depends_on:
      - userver-postgres
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 20s
      retries: 3

  userver-databackup:
    image: ferdn4ndo/s3-postgres-backup:1.1.2
    container_name: userver-databackup
    env_file:
      - ./backup/.env
    depends_on:
      - userver-postgres

networks:
  default:
    external: true
    name: nginx-proxy

volumes:
  dbdata:
